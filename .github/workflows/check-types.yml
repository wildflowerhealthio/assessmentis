name: Check Types

on: pull_request

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  check-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run type checking on all packages
        run: npx turbo run check-types
