name: Lint changed files

on: pull_request

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint-changed:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            working-directory: apps/frontend
          - name: functions
            working-directory: apps/functions
          - name: clinical-domain
            working-directory: domain/clinical-domain
          - name: config-domain
            working-directory: domain/config-domain
          - name: platform-domain
            working-directory: domain/platform-domain
          - name: daily-co-infrastructure
            working-directory: domain/daily-co-infrastructure
          - name: react-util
            working-directory: global/react-util
          - name: util
            working-directory: global/util
          - name: firebase-infrastructure
            working-directory: infrastructure/firebase-infrastructure
          - name: google-fhir-infrastructure
            working-directory: infrastructure/google-fhir-infrastructure
          - name: google-meet-infrastructure
            working-directory: infrastructure/google-meet-infrastructure
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          NODE_ENV=development npm ci --include=dev
          npm ci --workspaces
      
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: ${{ matrix.working-directory }}/**/*.{ts,tsx,js,jsx}

      - name: Run ESLint with reviewdog on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workdir: ${{ matrix.working-directory }}
          reporter: github-pr-review
          eslint_flags: '${{ steps.changed-files.outputs.all_changed_files }}'
          fail_level: error
          filter_mode: diff_context
