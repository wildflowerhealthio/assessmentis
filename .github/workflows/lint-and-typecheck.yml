name: Lint and Type Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            apps/**/*.{ts,tsx,js,jsx}
            packages/**/*.{ts,tsx,js,jsx}

      - name: Run ESLint with reviewdog on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: '${{ steps.changed-files.outputs.all_changed_files }}'
          fail_on_error: false
          filter_mode: diff_context

      - name: Run lint on all packages
        run: npm run lint

      - name: Run type checking on all packages
        run: npx turbo run check-types
