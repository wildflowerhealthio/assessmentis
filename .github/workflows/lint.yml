name: Lint

on: pull_request

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint with oxlint
        uses: oxc-project/oxlint-action@v3
        with:
          config: .oxlintrc.json

  check-markdown-changes:
    runs-on: ubuntu-latest
    outputs:
      has-markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            markdown:
              - '**/*.md'

  markdownlint:
    needs: check-markdown-changes
    if: needs.check-markdown-changes.outputs.has-markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          NODE_ENV=development npm ci --include=dev
          npm ci --workspaces

      - uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          config: .markdownlint-cli2.mjs
