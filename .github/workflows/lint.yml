name: Lint All Products

on: pull_request

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          NODE_ENV=development npm ci --include=dev
          npm ci --workspaces

      - name: ESLint with reviewdog
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workdir: |
            apps/frontend
            apps/functions
            domain/clinical-domain
            domain/config-domain
            domain/platform-domain
            domain/questionnaire-domain
            domain/document-domain
            domain/video-call-domain
            global/react-util
            global/util
            global/ontology
            infrastructure/daily-co-infrastructure
            infrastructure/firebase-web-infrastructure
            infrastructure/google-fhir-infrastructure
            infrastructure/google-meet-infrastructure
            infrastructure/jsx-document-infrastructure
          reporter: github-pr-review
          fail_level: error
          filter_mode: diff_context
