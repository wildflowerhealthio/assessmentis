name: Lint

on: pull_request

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          NODE_ENV=development npm ci --include=dev
          npm ci --workspaces

      - uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          config: .markdownlint-cli2.mjs

      - name: Lint apps/frontend
        uses: reviewdog/action-eslint@v1
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workdir: apps/frontend
          reporter: github-pr-review
          fail_level: error
          filter_mode: diff_context

      - name: Lint apps/functions
        uses: reviewdog/action-eslint@v1
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error
          filter_mode: diff_context
          workdir: apps/functions

      - name: Lint apps/aws_infra
        uses: reviewdog/action-eslint@v1
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error
          filter_mode: diff_context
          workdir: apps/aws_infra

      - name: Lint domain/clinical-domain
        uses: reviewdog/action-eslint@v1
        continue-on-error: true
        with:
